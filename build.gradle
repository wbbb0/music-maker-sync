plugins {
 id 'java-library'
 id 'net.neoforged.moddev' version '2.0.143'
}
version = '1.21.1-1.2.1-local.1'
group = 'xerca'
base { archivesName = 'music-maker-sync-neoforge' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral(); maven { url = 'https://api.modrinth.com/maven' }; maven { url = 'https://maven.ryanhcode.dev/releases' } }
sourceSets.main.java.srcDirs = ['XercaMusicMod/src/main/java']
sourceSets.main.resources.srcDirs = ['XercaMusicMod/src/main/resources']
neoForge {
 version = '21.1.248'
 runs {
  client { client() }
  server { server(); programArgument '--nogui' }
  data { clientData(); programArguments.addAll '--mod', 'xercamusic', '--all', '--output', file('XercaMusicMod/src/generated/resources').absolutePath, '--existing', file('XercaMusicMod/src/main/resources').absolutePath }
 }
 mods { xercamusic { sourceSet sourceSets.main } }
}
dependencies {
 compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.6'
 compileOnly 'org.jspecify:jspecify:1.0.0'
 compileOnly 'maven.modrinth:sable:2.0.5+mc1.21.1'
 // Sable embeds its companion; this reference is compile-only and never bundled.
 compileOnly 'dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0'
 testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
def metadata = tasks.register('generateModMetadata', ProcessResources) {
 from 'XercaMusicMod/src/main/templates'
 into 'build/generated/modMetadata'
 expand mod_license: 'GPL-3.0', mod_id: 'xercamusic', mod_version: version, mod_name: 'Music Maker Sync', neo_version: '21.1.248', minecraft_version_range: '[1.21.1]'
}
sourceSets.main.resources.srcDir metadata
neoForge.ideSyncTask metadata
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.named('test') { useJUnitPlatform() }
tasks.named('jar') { from('XercaMusicMod/LICENSE') { rename { 'LICENSE-Music-Maker' } } }
apply from: '../mod-updater/publish.gradle'
